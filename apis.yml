aid: binx-health
name: Binx Health
description: 'binx health, inc. is a Boston, Massachusetts point-of-care diagnostics
  company whose binx io platform is the first FDA-cleared, CLIA-waived molecular point-of-care
  test for chlamydia (Chlamydia trachomatis) and gonorrhea (Neisseria gonorrhoeae),
  returning central-lab-equivalent results in roughly thirty minutes from female vaginal
  swabs or male urine so a patient can be tested, diagnosed and treated in a single
  visit. The instrument pairs ultra-rapid PCR amplification with the company''s proprietary
  electrochemical detection and needs no calibration, preventative maintenance or
  result interpretation, so it can be run by staff with no laboratory training. binx
  sells into urgent care, OB/GYN, pediatrics, student health, government health and
  other specialty settings through distributors including Cardinal Health, McKesson,
  Medline and Fisher Healthcare. The company divested its at-home consumer testing
  business to imaware in December 2023 and retained the point-of-care molecular diagnostics
  business. binx health publishes no public developer program, API reference or machine-readable
  specification.'
